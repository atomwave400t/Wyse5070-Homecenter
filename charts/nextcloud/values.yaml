# Default values for nextcloud.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  nextcloud:
    repository: "nextcloud"
    # This sets the pull policy for images.
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "34.0.4"
  mariadb:
    repository: "mariadb"
    # This sets the pull policy for images.
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "lts"
  redis:
    repository: "redis"
    # This sets the pull policy for images.
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "latest"

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  nextcloud:  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
    port: 80
  mariadb:
    name: "mariadb"
  redis:
    name: "redis" 

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: true
  host: "nextcloud.krz.home"
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10g"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "14400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "14400"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "14400"
    nginx.ingress.kubernetes.io/send-timeout: "14400s" 
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffers: "off"

envVars:
  nextcloud:
    PUID: 1000
    PGID: 1000
    TZ: "Europe/Warsaw"
    MYSQL_DATABASE: "nextcloud"
    MYSQL_HOST: "127.0.0.1"
    REDIS_HOST: "localhost"
    NEXTCLOUD_ADMIN_USER: root
    NEXTCLOUD_TRUSTED_DOMAINS: "nextcloud.krz.home"
    PHP_MEMORY_LIMIT: 10G
    PHP_UPLOAD_LIMIT: 10G
    PHP_MAX_EXECUTION_TIME: 14400
    APACHE_TIMEOUT: "14400"
  mariadb:
    MYSQL_DATABASE: "nextcloud"
    MARIADB_AUTO_UPGRADE: 1

volumes:
  nextcloud:
    mountPath: /var/www/html
  mariadb:
    mountPath: /var/lib/mysql
  redis:
    mountPath: /data
