apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nextcloud.name" . }}-php-config
  namespace: {{ include "nextcloud.name" . }}
data:
  nextcloud.ini: |
    max_execution_time = 14400
    memory_limit=${PHP_MEMORY_LIMIT}
    upload_max_filesize=${PHP_UPLOAD_LIMIT}
    post_max_size=${PHP_UPLOAD_LIMIT}
