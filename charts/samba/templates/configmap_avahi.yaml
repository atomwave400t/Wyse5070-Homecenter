apiVersion: v1
kind: ConfigMap
metadata:
  name: timemachine-avahi
  namespace: samba
data:
  timemachine.service: |
    <?xml version="1.0" standalone="no"?>
    <!DOCTYPE service-group SYSTEM "avahi-service.dtd">

    <service-group>
      <name replace-wildcards="yes">Time Machine on %h</name>

      <service>
        <type>_smb._tcp</type>
        <port>445</port>
      </service>

      <service>
        <type>_adisk._tcp</type>
        <txt-record>sys=waMa=0,adVF=0x100</txt-record>
        <txt-record>dk0=TimeMachine,adVF=0x82</txt-record>
      </service>
    </service-group>
